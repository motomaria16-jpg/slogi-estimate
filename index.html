<style>

<script>
const STORAGE_KEY = 'slogi_locations_v1';
const FILES_DB_NAME = 'slogi_files_v1';
const FILES_STORE_NAME = 'attachments';
const fmtMoney = value => Math.round(Number(value) || 0).toLocaleString('ru-RU') + ' ₽';
const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

function showNotice(text, isError=false){
  const el = document.getElementById('notice');
  el.textContent = text || '';
  el.className = 'notice' + (text ? ' show' : '') + (isError ? ' error' : '');
}
function readLocations(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : [];
    return Array.isArray(data) ? data : [];
  }catch(err){
    showNotice('Браузер не дал доступ к сохранённым данным сайта.', true);
    return [];
  }
}
function writeLocations(items){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
function formatDate(iso){
  if(!iso) return 'дата не указана';
  const date = new Date(iso);
  return Number.isNaN(date.getTime()) ? 'дата не указана' : date.toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function safeFileName(value, fallback='файл'){
  const clean = String(value || '').trim().replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, ' ').slice(0,120);
  return clean || fallback;
}
function openFilesDb(){
  return new Promise((resolve, reject) => {
    if(!('indexedDB' in window)) return reject(new Error('Браузер не поддерживает хранилище файлов.'));
    const request = indexedDB.open(FILES_DB_NAME, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if(!db.objectStoreNames.contains(FILES_STORE_NAME)) db.createObjectStore(FILES_STORE_NAME, {keyPath:'key'});
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('Не удалось открыть хранилище файлов.'));
  });
}
async function getAttachment(locationId, type){
  const cloud=window.SlogiCloud&&await window.SlogiCloud.getAttachment(locationId,type); if(cloud)return cloud;
  try{
    const db = await openFilesDb();
    const result = await new Promise((resolve, reject) => {
      const request = db.transaction(FILES_STORE_NAME, 'readonly').objectStore(FILES_STORE_NAME).get(locationId + ':' + type);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });
    db.close();
    return result;
  }catch(err){ return null; }
}
async function deleteAttachments(locationId){
  if(window.SlogiCloud)await window.SlogiCloud.deleteAttachments(locationId);
  try{
    const db = await openFilesDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(FILES_STORE_NAME, 'readwrite');
      const store = tx.objectStore(FILES_STORE_NAME);
      store.delete(locationId + ':plan');
      store.delete(locationId + ':spec');
      store.delete(locationId + ':proposal');
      store.delete(locationId + ':estimate');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  }catch(err){}
}
function evalQty(expr, paramValues){
  if(typeof expr === 'number') return expr;
  let e = String(expr).replace(/\$/g, '');
  const addrs = Object.keys(paramValues || {}).sort((x,y)=>y.length-x.length);
  for(const addr of addrs) e = e.replace(new RegExp('\\b' + addr + '\\b','g'), paramValues[addr]);
  if(!/^[0-9+\-*/(). ,A-Za-z]+$/.test(e)) return 0;
  try{return Function('"use strict";function ROUND(x,n){n=n||0;const f=Math.pow(10,n);return Math.round(x*f)/f;}return (' + e + ')')();}catch(err){return 0;}
}
function computeEstimateFor(model, state){
  let grand = 0;
  const cats = ((model && model.categories) || []).map(cat => {
    let catSum = 0;
    const subs = (cat.subs || []).map(sb => {
      let subSum = 0;
      const items = (sb.items || []).map(it => {
        const qty = evalQty(it.qty_expr, state || {});
        const cost = Number.isFinite(Number(it.manual_cost)) ? Number(it.manual_cost) : (Number(it.price)||0) * qty;
        subSum += cost;
        return Object.assign({}, it, {qty,cost});
      });
      catSum += subSum;
      return Object.assign({}, sb, {items,subSum});
    });
    grand += catSum;
    return Object.assign({}, cat, {subs,catSum});
  });
  return {cats,grand};
}
function escapeSpreadsheet(value){return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function createEstimateExcelBlob(record){
  const model = record.model || {categories:[]};
  const state = record.state || {};
  const address = record.address || '';
  const result = computeEstimateFor(model, state);
  const rows = [];
  const merges = ['A1:F1','A2:F2','A3:F3'];
  let rowNo = 1;
  const textCell = (ref, value, style=7) => `<c r="${ref}" t="inlineStr" s="${style}"><is><t xml:space="preserve">${escapeSpreadsheet(value)}</t></is></c>`;
  const numCell = (ref, value, style=4) => `<c r="${ref}" s="${style}"><v>${Number(value)||0}</v></c>`;
  rows.push(`<row r="${rowNo}" ht="28" customHeight="1">${textCell('A'+rowNo,'СМЕТА',1)}</row>`); rowNo++;
  rows.push(`<row r="${rowNo}">${textCell('A'+rowNo,'Объект: '+(address||'Адрес не указан'),7)}</row>`); rowNo++;
  rows.push(`<row r="${rowNo}">${textCell('A'+rowNo,'Сформировано: '+new Date().toLocaleString('ru-RU'),7)}</row>`); rowNo++;
  rows.push(`<row r="${rowNo}"></row>`); rowNo++;
  merges.push(`A${rowNo}:F${rowNo}`);
  rows.push(`<row r="${rowNo}" ht="22" customHeight="1">${textCell('A'+rowNo,'ВХОДНЫЕ ПАРАМЕТРЫ',2)}</row>`); rowNo++;
  const inputParams = Array.isArray(model.params) ? model.params : [];
  if(inputParams.length){
    inputParams.forEach(param => {
      merges.push(`A${rowNo}:E${rowNo}`);
      const paramValue = Object.prototype.hasOwnProperty.call(state || {}, param.address) ? state[param.address] : param.value;
      const valueCell = paramValue !== '' && Number.isFinite(Number(paramValue))
        ? numCell('F'+rowNo, Number(paramValue), 4)
        : textCell('F'+rowNo, paramValue ?? '', 7);
      rows.push(`<row r="${rowNo}">${textCell('A'+rowNo,param.label || param.address || 'Параметр',7)}${valueCell}</row>`); rowNo++;
    });
  }else{
    merges.push(`A${rowNo}:F${rowNo}`);
    rows.push(`<row r="${rowNo}">${textCell('A'+rowNo,'Входные параметры не заданы',7)}</row>`); rowNo++;
  }
  rows.push(`<row r="${rowNo}"></row>`); rowNo++;
  rows.push(`<row r="${rowNo}" ht="24" customHeight="1">${['№','Тип','Наименование','Цена, ₽','Количество','Стоимость, ₽'].map((v,i)=>textCell(String.fromCharCode(65+i)+rowNo,v,6)).join('')}</row>`);
  const headerRow = rowNo;
  rowNo++;
  result.cats.forEach(cat => {
    merges.push(`A${rowNo}:E${rowNo}`);
    rows.push(`<row r="${rowNo}">${textCell('A'+rowNo,cat.top||'Без раздела',2)}${numCell('F'+rowNo,Math.round(cat.catSum),2)}</row>`); rowNo++;
    cat.subs.forEach(sb => {
      merges.push(`A${rowNo}:E${rowNo}`);
      rows.push(`<row r="${rowNo}">${textCell('A'+rowNo,sb.sub||'',3)}${numCell('F'+rowNo,Math.round(sb.subSum),3)}</row>`); rowNo++;
      sb.items.forEach(it => {
        rows.push(`<row r="${rowNo}">${textCell('A'+rowNo,it.num||'',7)}${textCell('B'+rowNo,it.group||'',7)}${textCell('C'+rowNo,it.name||'',7)}${numCell('D'+rowNo,Number(it.price)||0,4)}${numCell('E'+rowNo,Math.round(it.qty*100)/100,4)}${numCell('F'+rowNo,Math.round(it.cost),4)}</row>`); rowNo++;
      });
    });
  });
  merges.push(`A${rowNo}:E${rowNo}`);
  rows.push(`<row r="${rowNo}" ht="25" customHeight="1">${textCell('A'+rowNo,'ИТОГО',5)}${numCell('F'+rowNo,Math.round(result.grand),5)}</row>`);
  const lastRow = rowNo;
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:F${lastRow}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="${headerRow}" topLeftCell="A${headerRow+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols><col min="1" max="1" width="12" customWidth="1"/><col min="2" max="2" width="25" customWidth="1"/><col min="3" max="3" width="70" customWidth="1"/><col min="4" max="6" width="16" customWidth="1"/></cols><sheetData>${rows.join('')}</sheetData><autoFilter ref="A${headerRow}:F${lastRow}"/><mergeCells count="${merges.length}">${merges.map(ref=>`<mergeCell ref="${ref}"/>`).join('')}</mergeCells><pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.2" footer="0.2"/></worksheet>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="14"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF37545A"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE7EFEF"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF3E9D7"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE19B2D"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFEAD9CE"/></left><right style="thin"><color rgb="FFEAD9CE"/></right><top style="thin"><color rgb="FFEAD9CE"/></top><bottom style="thin"><color rgb="FFEAD9CE"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="4" fontId="2" fillId="3" borderId="1" xfId="0" applyNumberFormat="1"/><xf numFmtId="4" fontId="2" fillId="4" borderId="1" xfId="0" applyNumberFormat="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="right" vertical="top"/></xf><xf numFmtId="4" fontId="1" fillId="5" borderId="1" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Обычный" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const files = [
    {name:'[Content_Types].xml',blob:new Blob([`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],{type:'application/xml'})},
    {name:'_rels/.rels',blob:new Blob([`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],{type:'application/xml'})},
    {name:'xl/workbook.xml',blob:new Blob([`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Смета" sheetId="1" r:id="rId1"/></sheets></workbook>`],{type:'application/xml'})},
    {name:'xl/_rels/workbook.xml.rels',blob:new Blob([`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],{type:'application/xml'})},
    {name:'xl/worksheets/sheet1.xml',blob:new Blob([sheet],{type:'application/xml'})},
    {name:'xl/styles.xml',blob:new Blob([styles],{type:'application/xml'})}
  ];
  const zip = await createZip(files);
  return new Blob([zip], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function openDownloadTab(){
  const tab=window.open('', '_blank');
  if(tab&&!tab.closed){tab.document.title='Подготовка файла — СЛОГИ';tab.document.body.innerHTML='<p style="font:16px Arial,sans-serif;padding:24px;color:#33474B">Подготавливаем файл…</p>';}
  return tab;
}
function triggerBlobDownload(blob,filename,downloadTab=null){
  const url=URL.createObjectURL(blob);const tab=downloadTab&&!downloadTab.closed?downloadTab:openDownloadTab();
  if(tab&&!tab.closed){
    tab.document.title='Скачивание — СЛОГИ';tab.document.body.innerHTML='';
    const wrap=tab.document.createElement('div');wrap.style.cssText='font:16px Arial,sans-serif;padding:24px;color:#33474B;line-height:1.5';
    const text=tab.document.createElement('p');text.textContent='Скачивание началось. Если файл не загрузился автоматически, нажмите кнопку ниже.';
    const link=tab.document.createElement('a');link.href=url;link.download=filename;link.textContent='Скачать '+filename;link.style.cssText='display:inline-block;padding:11px 16px;border-radius:9px;background:#4B6E73;color:white;text-decoration:none;font-weight:700';
    wrap.append(text,link);tab.document.body.appendChild(wrap);link.click();
  }else{const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

const crcTable=(()=>{const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xEDB88320^(c>>>1):c>>>1;table[n]=c>>>0;}return table;})();
function crc32(bytes){let c=0xFFFFFFFF;for(const b of bytes)c=crcTable[(c^b)&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function u16(value){const a=new Uint8Array(2);new DataView(a.buffer).setUint16(0,value,true);return a;}
function u32(value){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,value>>>0,true);return a;}
function concatArrays(parts){const length=parts.reduce((s,p)=>s+p.length,0);const out=new Uint8Array(length);let offset=0;for(const p of parts){out.set(p,offset);offset+=p.length;}return out;}
function dosDateTime(date=new Date()){const year=Math.max(1980,date.getFullYear());return {time:(date.getHours()<<11)|(date.getMinutes()<<5)|(date.getSeconds()>>1),date:((year-1980)<<9)|((date.getMonth()+1)<<5)|date.getDate()};}
async function createZip(files){
  const encoder=new TextEncoder();const locals=[];const centrals=[];let offset=0;const dt=dosDateTime();
  for(const file of files){
    const name=encoder.encode(file.name);const data=new Uint8Array(await file.blob.arrayBuffer());const crc=crc32(data);const flag=0x0800;
    const local=concatArrays([u32(0x04034b50),u16(20),u16(flag),u16(0),u16(dt.time),u16(dt.date),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
    const central=concatArrays([u32(0x02014b50),u16(20),u16(20),u16(flag),u16(0),u16(dt.time),u16(dt.date),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);
    locals.push(local);centrals.push(central);offset+=local.length;
  }
  const centralData=concatArrays(centrals);const end=concatArrays([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralData.length),u32(offset),u16(0)]);
  return new Blob([...locals,centralData,end],{type:'application/zip'});
}

let allLocations=readLocations().filter(item=>item&&item.id&&item.address).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
function render(){
  const query=document.getElementById('location-search').value.trim().toLowerCase();
  const items=allLocations.filter(item=>item.address.toLowerCase().includes(query));
  document.getElementById('summary').textContent=items.length===allLocations.length?'Локаций: '+allLocations.length:'Найдено: '+items.length+' из '+allLocations.length;
  const root=document.getElementById('locations');
  if(!items.length){
    root.innerHTML=`<div class="empty" style="grid-column:1/-1"><h2>${allLocations.length?'Ничего не найдено':'Сохранённых объектов пока нет'}</h2><p>${allLocations.length?'Измените запрос поиска.':'Создайте паспорт объекта, укажите адрес и сохраните его.'}</p><a class="btn" href="passport.html">Создать объект</a></div>`;
    return;
  }
  root.innerHTML=items.map(item=>{
    const specName=item.specName||(item.excelLabel&&!/демо/i.test(item.excelLabel)?String(item.excelLabel).replace(/^Файл:\s*/,'').split(' · ')[0]:'');
    const spec=specName?`<span class="tag">Спецификация: ${escapeHtml(specName)}</span>`:'';
    const plan=item.planName?`<span class="tag">План: ${escapeHtml(item.planName)}</span>`:'';
    const proposal=item.proposalName?`<span class="tag">КП: ${escapeHtml(item.proposalName)}</span>`:'';
    const estimate=item.estimateName?`<span class="tag">Смета: ${escapeHtml(item.estimateName)}</span>`:'';
    return `<article class="location-card" data-id="${escapeHtml(item.id)}">
      <a class="card-main" href="passport.html?location=${encodeURIComponent(item.id)}">
        <h2 class="address">${escapeHtml(item.address)}</h2>
        <div class="meta"><span>Последнее сохранение</span><strong>${escapeHtml(formatDate(item.updatedAt))}</strong><span>Итого по смете</span><span class="total">${fmtMoney(item.total)}</span></div>
        ${(spec||plan||estimate||proposal)?`<div class="file-tags">${plan}${spec}${estimate}${proposal}</div>`:''}
      </a>
      <div class="card-actions">
        <button class="action-btn open" data-action="open" type="button">Открыть</button>
        <button class="action-btn download" data-action="download" type="button">⇩ Скачать всё</button>
        <button class="action-btn delete" data-action="delete" type="button" aria-label="Удалить объект" title="Удалить объект">×</button>
      </div>
    </article>`;
  }).join('');
}
async function downloadLocation(id, button, downloadTab){
  const item=allLocations.find(x=>x.id===id);if(!item)return;
  const old=button.textContent;button.disabled=true;button.textContent='Подготовка…';showNotice('');
  try{
    const [plan,spec,estimate,proposal]=await Promise.all([getAttachment(id,'plan'),getAttachment(id,'spec'),getAttachment(id,'estimate'),getAttachment(id,'proposal')]);
    const files=[];
    if(plan&&plan.blob)files.push({name:safeFileName(plan.name,'План помещения'),blob:plan.blob});
    if(spec&&spec.blob)files.push({name:safeFileName(spec.name,'Спецификация.xlsx'),blob:spec.blob});
    if(proposal&&proposal.blob)files.push({name:safeFileName(proposal.name,'Коммерческое предложение.doc'),blob:proposal.blob});
    if(estimate&&estimate.blob)files.push({name:safeFileName(estimate.name,'Смета.xlsx'),blob:estimate.blob});
    else files.push({name:'Смета.xlsx',blob:await createEstimateExcelBlob(item)});
    const zip=await createZip(files);
    triggerBlobDownload(zip,safeFileName('СЛОГИ '+item.address,'Локация')+'.zip',downloadTab);
    const missing=[];if(item.planName&&!plan)missing.push('план');if((item.specName||item.excelLabel)&&!spec&&!/демо/i.test(item.excelLabel||''))missing.push('спецификация');if(item.estimateName&&!estimate)missing.push('смета');if(item.proposalName&&!proposal)missing.push('коммерческое предложение');
    showNotice(missing.length?'Архив скачан. В старой записи не найдено вложение: '+missing.join(', ')+'. Смета включена в архив.':'Архив со всеми файлами и сметой скачан.');
  }catch(err){if(downloadTab&&!downloadTab.closed)downloadTab.close();showNotice('Не удалось подготовить архив для скачивания.',true);}
  finally{button.disabled=false;button.textContent=old;}
}
async function deleteLocation(id){
  const item=allLocations.find(x=>x.id===id);if(!item)return;
  if(!confirm('Удалить объект «'+item.address+'» вместе с сохранёнными файлами?'))return;
  allLocations=allLocations.filter(x=>x.id!==id);writeLocations(allLocations);await deleteAttachments(id);showNotice('Локация удалена.');render();
}
document.getElementById('locations').addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const card=button.closest('.location-card');if(!card)return;
  const id=card.dataset.id;const action=button.dataset.action;
  if(action==='open')window.location.href='passport.html?location='+encodeURIComponent(id);
  if(action==='download'){const downloadTab=openDownloadTab();downloadLocation(id,button,downloadTab);}
  if(action==='delete')deleteLocation(id);
});
document.getElementById('location-search').addEventListener('input',render);
render();
</script>
