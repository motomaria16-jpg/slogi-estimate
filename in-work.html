<!DOCTYPE html>
<html lang="ru" data-slogi-access="pending">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="no-cache,no-store,must-revalidate" http-equiv="Cache-Control"/>
  <title>СЛОГИ — Помещения в работе</title>
  <link href="favicon.svg?v=40" rel="icon"/>
  <link href="professional-ui.css?v=31" rel="stylesheet"/>
  <link href="app-shell.css?v=61" rel="stylesheet"/>
  <link href="layout-v76-1-1.css?v=7611" rel="stylesheet"/>
  <link href="objects-visual-standard.css?v=33" rel="stylesheet"/>
  <link href="phase0.css?v=68" rel="stylesheet"/>
  <link href="in-work.css?v=76142" rel="stylesheet"/>
  <link href="search-space-card-modal.css?v=76165" rel="stylesheet"/>
  <link href="premises-list-card.css?v=76138" rel="stylesheet"/>
  <link href="schoolslogi-theme-v76-1-5.css?v=76114" rel="stylesheet"/>
  <link href="password-gate.css?v=7617" rel="stylesheet"/>
  <link href="figma-shell-v76-1-15.css?v=76141" rel="stylesheet"/>
  <script src="phase0-config.js?v=76138"></script>
  <script src="shared-workspace.js?v=76134"></script>
  <script src="fast-navigation.js?v=76140"></script>
</head>
<body class="slogi-search-page in-work-page">
<header class="site-header"><div class="top"><div class="brand"><a class="logo-link" href="index.html" aria-label="СЛОГИ — главная"><div class="logo-word" aria-hidden="true"><span>С</span><span>Л</span><span>О</span><span>Г</span><span>И</span></div></a></div></div></header>

<main class="in-work-main" id="in-work-main">
  <section class="in-work-hero" aria-labelledby="in-work-title">
    <div>
      <div class="in-work-title-line"><h1 id="in-work-title">Помещения в работе</h1><span class="in-work-count" id="in-work-count">0 объектов</span></div>
    </div>
    <div class="in-work-hero-actions">
      <button class="in-work-btn" id="in-work-add-space" type="button">Добавить помещение</button>
      <div class="in-work-mode-switch" role="tablist" aria-label="Режим страницы">
        <button id="in-work-list-tab" role="tab" type="button" aria-selected="true" aria-controls="in-work-list-panel" data-mode="list">Список и карта</button>
        <button id="in-work-calendar-tab" role="tab" type="button" aria-selected="false" aria-controls="in-work-calendar-panel" data-mode="calendar" tabindex="-1">Календарь</button>
      </div>
    </div>
  </section>

  <section id="in-work-list-panel" role="tabpanel" aria-labelledby="in-work-list-tab">
    <div class="in-work-filters" aria-label="Фильтры помещений">
      <label class="in-work-search"><span class="in-work-sr-only">Поиск помещения</span><input id="in-work-search" type="search" autocomplete="off" placeholder="Поиск по адресу, контакту или ответственному"/></label>
      <div class="in-work-status-filters" id="in-work-status-filters" role="group" aria-label="Статус помещения">
        <button type="button" class="active" aria-pressed="true" data-status="">Все</button>
        <button type="button" aria-pressed="false" data-status="new">Новые</button>
        <button type="button" aria-pressed="false" data-status="scheduled">Просмотр назначен</button>
        <button type="button" aria-pressed="false" data-status="visited">Просмотр завершён</button>
        <button type="button" aria-pressed="false" data-status="ready">Готово к КП</button>
      </div>
    </div>

    <div class="in-work-mobile-views" role="group" aria-label="Отображение помещений">
      <button class="active" type="button" data-mobile-view="list" aria-pressed="true">Список</button>
      <button type="button" data-mobile-view="map" aria-pressed="false">Карта</button>
    </div>

    <div class="in-work-workspace" data-mobile-view="list">
      <section class="in-work-list-column" aria-label="Список помещений в работе">
        <p class="in-work-sr-only" id="in-work-list-summary" aria-live="polite">Загрузка…</p>
        <div class="in-work-list" id="in-work-list" aria-live="polite"></div>
        <div class="in-work-empty" id="in-work-empty" hidden><span aria-hidden="true">⌕</span><h3>Ничего не найдено</h3><p>Измените фильтры или возьмите помещение в работу со страницы поиска.</p><a class="in-work-btn primary" href="available-spaces.html">Перейти к поиску</a></div>
      </section>

      <aside class="in-work-map-card" aria-labelledby="in-work-map-title">
        <div class="in-work-section-head"><h2 id="in-work-map-title">Карта</h2><span class="in-work-map-count" id="in-work-map-count">0 точек</span></div>
        <div class="in-work-map-stage">
          <div class="in-work-map" id="in-work-map" tabindex="0" aria-label="Карта помещений в работе"></div>
          <div class="in-work-map-loading" id="in-work-map-loading" role="status"><strong>Загружаем карту…</strong><span>Список помещений остаётся доступен.</span></div>
          <div class="in-work-map-message" id="in-work-map-message">Объекты без координат остаются в списке.</div>
        </div>
      </aside>
    </div>
  </section>

  <section id="in-work-calendar-panel" role="tabpanel" aria-labelledby="in-work-calendar-tab" hidden>
    <div class="in-work-calendar-toolbar">
      <div class="in-work-calendar-nav">
        <button class="in-work-icon-btn" type="button" data-calendar-nav="prev" aria-label="Предыдущий период">‹</button>
        <button class="in-work-btn" type="button" data-calendar-nav="today">Сегодня</button>
        <button class="in-work-icon-btn" type="button" data-calendar-nav="next" aria-label="Следующий период">›</button>
        <h2 id="in-work-calendar-range" aria-live="polite">—</h2>
      </div>
      <div class="in-work-calendar-actions">
        <div class="in-work-calendar-views" role="group" aria-label="Масштаб календаря">
          <button type="button" data-calendar-view="day">День</button>
          <button class="active" type="button" data-calendar-view="week">Неделя</button>
          <button type="button" data-calendar-view="month">Месяц</button>
        </div>
        <button class="in-work-btn primary" type="button" data-action="new-visit">＋ Назначить просмотр</button>
      </div>
    </div>
    <div class="in-work-calendar" id="in-work-calendar" aria-label="Календарь просмотров"></div>
  </section>
</main>

<div class="in-work-overlay" id="in-work-overlay" hidden>
  <aside class="in-work-drawer" id="in-work-drawer" role="dialog" aria-modal="true" aria-labelledby="in-work-drawer-title"></aside>
</div>
<div class="in-work-toast" id="in-work-toast" role="status" aria-live="polite"></div>

<script src="professional-core.js?v=31"></script>
<script src="workflow-storage.js?v=31"></script>
<script src="professional-shell.js?v=76131"></script>
<script src="yandex-map-config.js?v=62"></script>
<script src="clusters-data.js?v=31"></script>
<script src="cluster-geometry.js?v=7617"></script>
<script src="search-space-card.js?v=76131"></script>
<script src="premises-list-card.js?v=76136"></script>
<script src="phase0-services.js?v=76136"></script>
<script src="work-calendar.js?v=76164"></script>
<script src="search-space-card-modal.js?v=76165"></script>
<script src="in-work-app.js?v=76164"></script>
<script src="figma-shell-v76-1-15.js?v=76133"></script>
</body>
</html>
